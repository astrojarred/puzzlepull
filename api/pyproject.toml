[project]
name = "puzzlepull"
version = "0.1.0"
description = "Convert online crossword puzzles to .ipuz"
authors = [
    { name = "Jarred Green", email = "astrojarred@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "fastapi[standard]>=0.116.1",
    "playwright>=1.52.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "xword-dl>=2025.10.14",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=9.0.2",
]

[tool.uv]
package = false
